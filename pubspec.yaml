name: wikidata_catalog
description: "Каталог сущностей Wikidata"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  intl: any
  dio: ^5.11.1
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  generate: true
